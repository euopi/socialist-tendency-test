<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MarxistAxes Results Tally</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="styles.css">
<style>
  .stathead { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 1.5rem; margin-bottom: 1.6rem; }
  .bigtotal b { display: block; font-size: clamp(2.6rem, 6vw, 3.6rem); font-weight: 800; letter-spacing: -0.04em; line-height: 1; }
  .bigtotal span { color: var(--ink-2); font-size: 0.9rem; }
  .famsum { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; margin-bottom: 2.4rem; }
  .famsum div { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 0.8rem 1rem; display: flex; justify-content: space-between; gap: 1rem; }
  .famsum b { font-variant-numeric: tabular-nums; }
  .rank .r.zero { opacity: 0.55; }
</style>
</head>
<body>
<header class="top"><div class="wrap topin">
  <a class="mark" href="./" style="text-decoration:none"><svg viewBox="0 0 32 32" aria-hidden="true"><g stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><line x1="2" y1="16" x2="30" y2="16"/><line x1="16" y1="2" x2="16" y2="30"/><line x1="3.9" y1="9" x2="28.1" y2="23"/><line x1="3.9" y1="23" x2="28.1" y2="9"/><line x1="9" y1="3.9" x2="23" y2="28.1"/><line x1="23" y1="3.9" x2="9" y2="28.1"/></g><circle cx="16" cy="16" r="3.2" fill="currentColor"/></svg><b>Marxist<span>Axes</span></b></a>
  <div class="right"><a class="btn soft small" href="./">Take the test</a></div>
</div></header>
<main class="res"><div class="wrap">
  <div class="stathead">
    <div><span class="eyebrow">Results tally</span><h1 class="h2">Most common results</h1>
      <p class="sub" style="margin-top:0.6rem">Every completed test adds one to its top tendency. Nothing else about the person is recorded.</p></div>
    <div class="bigtotal" id="total" hidden><b id="totalNum"></b><span>completed tests</span></div>
  </div>
  <p id="status" class="muted">Loading the tally&hellip;</p>
  <div id="fams" class="famsum" hidden></div>
  <div id="list" class="rank"></div>
</div></main>
<script>
(function () {
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  var status = document.getElementById('status');
  fetch('/api/stats').then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); }).then(function (x) {
    if (!x.ok) { status.textContent = x.j && x.j.error === 'Storage is not connected' ? 'The tally database isn\'t connected yet. Connect Upstash for Redis to this project in Vercel, then redeploy.' : 'Couldn\'t load the tally: ' + ((x.j && x.j.error) || 'unknown error') + '.'; return; }
    var d = x.j, max = d.rows.length ? Math.max(1, d.rows[0].count) : 1;
    document.getElementById('totalNum').textContent = d.total.toLocaleString();
    document.getElementById('total').hidden = false;
    if (!d.total) { status.textContent = 'No completed tests yet. The tally fills in as people finish the test.'; }
    else status.hidden = true;
    var fam = {};
    d.rows.forEach(function (r) { fam[r.family] = (fam[r.family] || 0) + r.count; });
    var famRows = Object.keys(fam).sort(function (a, b) { return fam[b] - fam[a]; });
    var fe = document.getElementById('fams');
    fe.innerHTML = famRows.map(function (f) { return '<div><span>' + esc(f) + '</span><b>' + (d.total ? Math.round(100 * fam[f] / d.total) : 0) + '%</b></div>'; }).join('');
    fe.hidden = !d.total;
    document.getElementById('list').innerHTML = d.rows.map(function (r, i) {
      var share = d.total ? Math.round(1000 * r.count / d.total) / 10 : 0;
      return '<div class="r' + (r.count ? '' : ' zero') + '"><span class="n">' + (i + 1) + '</span><span class="nm"><b>' + esc(r.name) + '</b><i>' + esc(r.family) + '</i></span>' +
        '<span class="meter"><span style="width:' + (100 * r.count / max).toFixed(1) + '%"></span></span><span class="pct">' + r.count.toLocaleString() + '</span></div>';
    }).join('');
  }).catch(function () { status.textContent = 'Couldn\'t reach the tally. It only works on the deployed site.'; });
})();
</script>
</body>
</html>
